[colors]
background = #6b635a
background-alt = #fffee7
foreground = #fffee7
primary = #141414
secondary = #383838
warn = #117743
disabled = #141414
alert = #750000
border-color = #ece9e3

[bar/example]
width = 100%
height = 13pt
radius = 0pt
bottom = true


; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt

padding-left = 0
padding-right = 3
	
module-margin = 1
		
separator = |
separator-foreground = ${colors.disabled}

font-0 = bitbuntu:size=10;2
font-1 = terminus:size=10;2
font-2 = Noto Sans Symbols 2:size=10;3


modules-left = xworkspaces xwindow
modules-right =  battery mutemic pulseaudio memory cpu network date


cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = #fffee7
label-active-foreground = #6b635a
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.warn}
label-urgent-padding = 2

label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %{B#4e4e62 F#fffee7}  %title:60:60%  %{B-}

;[module/filesystem]
;type = internal/fs
;interval = 30
;mount-0 = /
;label-mounted = %{F#B3A06D}%mountpoint%%{F-} %percentage_used%%
;label-xwindow-alignment = center
;label-unmounted = %mountpoint% not mounted
;label-unmounted-foreground = ${colors.disabled}

[module/mutemic]
type = custom/script
exec = mic-status
interval = 100000
tail = false
click-left = mutemic
label = %{B#262626 F#ece9e3} %output% %{B-}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %{B#ece9e3 F#141414} vol  %percentage%% %{B-}

label-muted = %{F#ffffff}  vol µ  %{F-}
label-muted-background = ${colors.alert}


[module/memory]
type = internal/memory
interval = 10
format-prefix = "ram "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 13
format-prefix = "cpu "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%


[module/network]
type = custom/script
exec = wlan
interval = 10



[module/date]
type = custom/script
interval = 60
exec = echo "%{F#a29c9f}$(latinname)%{F-} $(date '+%Y-%m-%d %H:%M')"
label = %output%
label-foreground = ${colors.primary}
[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini

;[module/keyboard]
;click-left = cyclekeyboards | polybar-restart
;type = custom/script
;exec = "setxkbmap -query | grep "layout" | awk '{print $2}'"
;format = <label>
;interval = 10000000

label = %{B#a29c9f F#212121}%output:4:4%‎‎ 


[module/battery]
type = internal/battery
ramp-capacity-0 = %{B#d70000 F#FFFFFF} low!
ramp-capacity-1 = %{B#ffa500 F#FFFFFF} dis 
ramp-capacity-2 = %{B#007840 F#FFFFFF} full

battery = BAT0
adapter = AC

full-at = 99

label-full = %{B#5c6d73 F#cec7ba} ☻ full  %percentage%% %{B-}
format-full = <label-full>

label-charging = %{B#828282 F#ffffff} char  %percentage%% %{B-}
format-charging =  <label-charging>

label-discharging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging> %{B-}
